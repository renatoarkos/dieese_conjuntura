# Motores de coleta semanal — DIEESE Conjuntura
#
# Decisão registrada em docs/08-decisoes-adr/0003-agendamento-github-actions.md.
# Cobre todos os motores de fontes com periodicidade mensal ou mais frequente
# (a maior parte do catálogo). Rodar semanalmente uma fonte mensal é seguro —
# a nova publicação é capturada em até 7 dias, sem precisar saber o dia exato
# de divulgação de cada fonte.
#
# Inclui o motor de raspagem direcionada (CNI/UCI) e o de microdados (CAGED) —
# ambos já testados e funcionais, mas com maior risco de falha que os motores
# de API pura (ver docs/02-arquitetura/PLANO_MOTORES_INGESTAO.md, Seção 4).
# Uma falha isolada em um step não interrompe os demais (continue-on-error).

name: Motores de coleta — semanais

on:
  schedule:
    - cron: "0 13 * * 1" # 13:00 UTC toda segunda-feira
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Única dependência de terceiros do projeto (o resto é stdlib puro —
      # ver ADR 0001/0002): py7zr, para extrair os microdados do Novo CAGED
      # (.7z), usada só pela transformação curated de salário médio CAGED.
      - name: Instalar py7zr (extração de .7z do Novo CAGED)
        run: pip install py7zr

      # pdftotext (poppler-utils) — extrai o texto dos boletins PDF do DIEESE
      # (ICT, Greves, De Olho nas Negociações). Geralmente já vem no runner
      # ubuntu-latest, mas instala explicitamente para não depender disso.
      - name: Instalar poppler-utils (pdftotext, boletins PDF do DIEESE)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # --- Bloco 1 — Macroeconomia ---
      - name: Câmbio (BCB/SGS)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_1_macroeconomia/coleta_cambio_bcb.py

      - name: PMC — comércio (SIDRA 8881)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_1_macroeconomia/coleta_pmc_comercio_sidra.py

      - name: PMS — serviços (SIDRA 5906)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_1_macroeconomia/coleta_pms_servicos_sidra.py

      - name: PIM — indústria (SIDRA 8888)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_1_macroeconomia/coleta_pim_industria_sidra.py

      - name: Balança comercial (Comex Stat)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_1_macroeconomia/coleta_balanca_comercial_comexstat.py

      - name: UCI (CNI — raspagem direcionada)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_1_macroeconomia/coleta_uci_cni.py

      - name: Índice de Commodities Brasil (BCB/SGS)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_1_macroeconomia/coleta_commodities_bcb.py

      # --- Bloco 2 — Monetário e Crédito ---
      - name: Juros por modalidade (BCB/SGS)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_2_monetario_credito/coleta_juros_modalidade_bcb.py

      - name: Endividamento — parte BCB (família RNDBF)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_2_monetario_credito/coleta_endividamento_bcb.py

      - name: NFSP (BCB/SGS 5760)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_2_monetario_credito/coleta_nfsp_bcb.py

      - name: Endividamento — parte PEIC (FecomercioSP)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_2_monetario_credito/coleta_endividamento_peic_fecomercio.py

      - name: Saldo de crédito SFN (BCB/SGS)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_2_monetario_credito/coleta_saldo_credito_sfn_bcb.py

      # --- Bloco 3 — Inflação ---
      - name: IPCA índice geral (SIDRA 7060)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_3_inflacao/coleta_ipca_sidra.py

      - name: INPC índice geral (SIDRA 7063)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_3_inflacao/coleta_inpc_sidra.py

      - name: IGP-M (via BCB/SGS 189)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_3_inflacao/coleta_igpm_bcb.py

      - name: Cesta básica x salário mínimo (DIEESE/Conab)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_3_inflacao/coleta_cesta_basica_dieese.py

      - name: Preços de combustíveis (ANP)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_3_inflacao/coleta_combustiveis_anp.py

      # --- Bloco 4 — Mercado de trabalho ---
      - name: Reajustes e pisos salariais em negociação coletiva (DIEESE)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_4_mercado_trabalho/coleta_negociacao_coletiva_dieese.py

      - name: Índice da Condição do Trabalho — ICT (DIEESE)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_4_mercado_trabalho/coleta_ict_dieese.py

      - name: Balanço das Greves (DIEESE/SAG)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_4_mercado_trabalho/coleta_greves_dieese.py

      # --- Bloco 5 — Novo CAGED (microdados) ---
      - name: CAGED — microdados brutos (FTP MTE/PDET)
        continue-on-error: true
        run: python3 pipelines/ingestao/bloco_5_caged/coleta_caged_microdados_ftp.py

      # --- Camada CURATED (ADR 0005) — transforma o RAW recém-coletado acima
      # em pontos prontos para o painel (frontend/). Endividamento PEIC (.xlsx
      # sem parser) e Cesta básica (PDF do DIEESE, sem extração de texto) não
      # têm transformação ainda — ver docs/08-decisoes-adr/0005-... ---
      - name: "CURATED: Câmbio"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_cambio_bcb.py

      - name: "CURATED: PMC — comércio"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_pmc_comercio_sidra.py

      - name: "CURATED: PMS — serviços"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_pms_servicos_sidra.py

      - name: "CURATED: PIM — indústria"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_pim_industria_sidra.py

      - name: "CURATED: Balança comercial"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_balanca_comercial_comexstat.py

      - name: "CURATED: Índice de Commodities Brasil"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_commodities_bcb.py

      - name: "CURATED: Juros por modalidade"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_juros_modalidade_bcb.py

      - name: "CURATED: Endividamento — parte BCB"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_endividamento_bcb.py

      - name: "CURATED: NFSP"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_nfsp_bcb.py

      - name: "CURATED: Saldo de crédito SFN"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_saldo_credito_sfn_bcb.py

      - name: "CURATED: IPCA"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_ipca_sidra.py

      - name: "CURATED: INPC"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_inpc_sidra.py

      - name: "CURATED: IGP-M"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_igpm_bcb.py

      - name: "CURATED: Preços de combustíveis"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_combustiveis_anp.py

      - name: "CURATED: Salário médio CAGED"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_salario_caged.py

      - name: "CURATED: ICT-DIEESE"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_ict_dieese.py

      - name: "CURATED: Balanço das Greves"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_greves_dieese.py

      - name: "CURATED: Reajustes e pisos salariais"
        continue-on-error: true
        run: python3 pipelines/curated/transformar_negociacao_coletiva_dieese.py

      - name: Publicar dados coletados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-semanal-${{ github.run_id }}
          path: data/raw/
          retention-days: 90
